name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  range:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Harness unit tests (pure stdlib)
        run: python3 harness/judge.py && python3 harness/test_session.py && python3 harness/test_web.py && python3 harness/validate_scenarios.py

      - name: Build range image
        run: docker build --build-arg KNIGHTFALL_GIT_SHA="${{ github.sha }}" -t knightfall .

      - name: Challenges are solvable (selftest all)
        run: docker run --rm knightfall selftest all

      - name: Fix-oracles hold (defense works, mission still runs)
        run: docker run --rm knightfall oracle

      - name: Benchmark discriminates (null=0, scripted=pass)
        run: docker run --rm --entrypoint bash knightfall -lc "source /opt/ros/humble/setup.bash && python3 harness/test_batch_sanity.py"

      - name: E1 multi-container skeleton (discovery + isolation)
        run: bash compose/e1_check.sh
