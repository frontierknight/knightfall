name: gz-image

# Builds the Gazebo-tier image, proves it runs headless (tools/gz/smoke.sh), and publishes it to
# ghcr.io/frontierknight/knightfall-gz so restricted environments can pull instead of build.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["docker/gz/**", "tools/gz/**", "sim/**", ".github/workflows/gz-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  gz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMG: ghcr.io/frontierknight/knightfall-gz
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build Gazebo-tier image
        id: build
        run: docker build -f docker/gz/Dockerfile --build-arg KNIGHTFALL_GIT_SHA="${{ github.sha }}" -t knightfall-gz .

      - name: Headless smoke (lidar, RTF, Nav2 goal, ground truth)
        shell: bash
        run: docker run --rm knightfall-gz bash tools/gz/smoke.sh 2>&1 | tee smoke.log

      - name: Keep smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gz-smoke
          path: smoke.log
          if-no-files-found: ignore

      # The SHA tag is published even if the smoke fails, so the image can be pulled and debugged.
      - name: Publish to GHCR
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHA="${GITHUB_SHA::12}"
          docker tag knightfall-gz "$IMG:$SHA" && docker push "$IMG:$SHA"
          if [ "${{ job.status }}" = "success" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag knightfall-gz "$IMG:latest" && docker push "$IMG:latest"
          fi
